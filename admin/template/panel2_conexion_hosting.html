<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel 2 - Conexion de hosting con dominio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .panel { background: #fff; border: 1px solid #999; width: 480px; padding: 0; }
  .panel-header { display: flex; align-items: center; border-bottom: 1px solid #ccc; padding: 4px 8px; }
  .panel-title { font-size: 13px; color: #333; flex: 1; }
  .panel-number { background: #fff; border: 1px solid #999; padding: 2px 8px; font-size: 13px; font-weight: bold; }
  .content { padding: 12px 14px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .input-row input { flex: 1; border: 1px solid #999; padding: 5px 8px; font-size: 13px; }
  .btn, .btn-open { border: 1.5px solid #7c5fc5; background: #fff; color: #333; padding: 5px 18px; font-size: 13px; cursor: pointer; }
  .btn:hover, .btn-open:hover { background: #f0ecfc; }
  .step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .step-num { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #333; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; margin-top: 1px; }
  .step-content { font-size: 13px; color: #333; line-height: 1.5; flex: 1; }
  .step-row, .label-row, .dns-row { display: flex; align-items: center; gap: 10px; }
  .dns-row { margin-top: 6px; }
  .dns-item { display: inline-flex; align-items: center; gap: 8px; }
  .dns-link { color: #7c5fc5; font-size: 13px; text-decoration: none; }
  .icon-copy, .step-icon { width: 22px; height: 22px; border: 1.5px solid #7c5fc5; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; border-radius: 6px; }
  .icon-copy svg, .step-icon svg { width: 13px; height: 13px; }
</style>
</head>
<body>
<div class="panel">
  <div class="panel-header">
    <span class="panel-title">Conexion de hosting con dominio</span>
    <span class="panel-number">2</span>
  </div>
  <div class="content">
    <div class="input-row">
      <input type="text" placeholder="" />
      <button class="btn">Aplicar</button>
    </div>
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-content">
        <div class="step-row">
          <div class="step-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><path d="M6 4h6v6"/><path d="M12 4 5 11"/><rect x="3" y="6" width="7" height="7" rx="1.4"/></svg></div>
          <span>Enlace de Godaddy directo al dominio seleccionado:</span>
          <button class="btn-open">Abrir</button>
        </div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-content">
        <div class="label-row">
          <div class="step-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M2.8 8h10.4M8 2.5c1.7 1.6 2.6 3.5 2.6 5.5S9.7 11.9 8 13.5C6.3 11.9 5.4 10 5.4 8s.9-3.9 2.6-5.5"/></svg></div>
          <span>Dirijase a la pestana DNS y seleccione la subpestana Servidores de nombre.</span>
        </div>
        <br>
        <div class="label-row">
          <div class="step-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="3" y="3" width="10" height="3" rx="1"/><rect x="3" y="7" width="10" height="3" rx="1"/><circle cx="5" cy="4.5" r=".6" fill="#7c5fc5"/><circle cx="5" cy="8.5" r=".6" fill="#7c5fc5"/></svg></div>
          <span>A continuacion sustituya los que ya se encuentran por los siguientes DNS:</span>
        </div>
        <div class="dns-row">
          <div class="dns-item">
            <div class="step-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="3" y="3" width="10" height="4" rx="1"/><path d="M5 5h.01M8 5h5"/></svg></div>
            <span class="dns-link">%DNS1%</span>
          </div>
          <div class="icon-copy"><svg viewBox="0 0 13 13" fill="none" stroke="#7c5fc5" stroke-width="1.5"><rect x="1" y="3" width="9" height="9" rx="1"/><path d="M4 3V2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-1"/></svg></div>
        </div>
        <div class="dns-row">
          <div class="dns-item">
            <div class="step-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="3" y="9" width="10" height="4" rx="1"/><path d="M5 11h.01M8 11h5"/></svg></div>
            <span class="dns-link">%DNS2%</span>
          </div>
          <div class="icon-copy"><svg viewBox="0 0 13 13" fill="none" stroke="#7c5fc5" stroke-width="1.5"><rect x="1" y="3" width="9" height="9" rx="1"/><path d="M4 3V2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-1"/></svg></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
