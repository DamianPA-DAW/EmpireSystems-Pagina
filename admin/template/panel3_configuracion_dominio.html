<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel 3 - Configuracion del hosting por cada dominio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .panel { background: #fff; border: 1px solid #999; width: 480px; padding: 0; }
  .panel-header { display: flex; align-items: center; border-bottom: 1px solid #ccc; padding: 4px 8px; }
  .panel-title { font-size: 13px; color: #333; flex: 1; }
  .panel-number { background: #fff; border: 1px solid #999; padding: 2px 8px; font-size: 13px; font-weight: bold; }
  .content { padding: 14px 16px; }
  .step { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .step-num { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #333; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  .step-icon { width: 22px; height: 22px; border: 1.5px solid #7c5fc5; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-icon svg { width: 13px; height: 13px; }
  .step-label { font-size: 13px; color: #333; flex: 1; }
  .btn-open { border: 1.5px solid #7c5fc5; background: #fff; color: #333; padding: 5px 20px; font-size: 13px; cursor: pointer; }
  .btn-open:hover { background: #f0ecfc; }
</style>
</head>
<body>
<div class="panel">
  <div class="panel-header">
    <span class="panel-title">Configuracion del hosting por cada dominio</span>
    <span class="panel-number">3</span>
  </div>
  <div class="content">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="3" y="3" width="10" height="10" rx="1.5"/><path d="M6 1.8v2.4M10 1.8v2.4M6 11.8v2.4M10 11.8v2.4M1.8 6h2.4M11.8 6h2.4M1.8 10h2.4M11.8 10h2.4"/></svg></div>
      <span class="step-label">MultiPHP Manager</span>
      <button class="btn-open">Abrir</button>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><path d="M5 2.5h4l2.5 2.5V13H5z"/><path d="M9 2.5V5h2.5M6.3 8.2 5 9.5l1.3 1.3M9.7 8.2 11 9.5l-1.3 1.3"/></svg></div>
      <span class="step-label">MultiPHP INI Editor</span>
      <button class="btn-open">Abrir</button>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.3"><circle cx="8" cy="8" r="5.5"/><path d="m4.8 5.2 1.6 5.6 1.7-5 1.5 5 1.6-5.6"/></svg></div>
      <span class="step-label">Softaculous WordPress</span>
      <button class="btn-open">Abrir</button>
    </div>
  </div>
</div>
</body>
</html>
