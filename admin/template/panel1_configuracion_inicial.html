<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel 1 - Configuracion inicial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .panel { background: #fff; border: 1px solid #999; width: 480px; padding: 0; }
  .panel-number { background: #fff; border: 1px solid #999; padding: 2px 8px; font-size: 13px; font-weight: bold; }
  .panel-title { font-size: 13px; color: #333; flex: 1; padding-left: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; padding: 10px; gap: 8px; }
  .field { border: 1.5px solid #7c5fc5; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; background: #fff; min-height: 36px; gap: 10px; }
  .field span { font-size: 12px; color: #444; }
  .field-icon { width: 24px; height: 24px; border: 1.5px solid #7c5fc5; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; border-radius: 6px; }
  .field-icon svg { width: 15px; height: 15px; }
  .top-bar { display: flex; align-items: center; padding: 6px 10px; gap: 6px; }
  .top-bar .minus, .top-bar .plus { border: 1.5px solid #7c5fc5; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; color: #333; }
  .top-bar .title { flex: 1; text-align: center; border: 1.5px solid #7c5fc5; padding: 4px 10px; font-size: 13px; color: #333; }
</style>
</head>
<body>
<div class="panel">
  <div style="display:flex; align-items:center; border-bottom:1px solid #ccc; padding:4px 8px;">
    <span class="panel-title">Configuracion inicial</span>
    <span class="panel-number">1</span>
  </div>
  <div class="top-bar">
    <div class="minus">-</div>
    <div class="title">Banahosting - Liberrimo.com</div>
    <div class="plus">+</div>
  </div>
  <div class="grid">
    <div class="field"><span>Dominio</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M2.8 8h10.4M8 2.5c1.7 1.6 2.6 3.5 2.6 5.5S9.7 11.9 8 13.5C6.3 11.9 5.4 10 5.4 8s.9-3.9 2.6-5.5"/></svg></div></div>
    <div class="field"><span>IP</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="4" r="1.5"/><circle cx="13" cy="8" r="1.5"/><circle cx="8" cy="12" r="1.5"/><path d="M4.2 7 6.8 5M9.2 5 11.8 7M4.2 9 6.8 11M9.2 11 11.8 9"/></svg></div></div>
    <div class="field"><span>Correo de acceso</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="2" y="4" width="12" height="8" rx="1.5"/><path d="m3.5 5.2 4.5 3.6 4.5-3.6"/></svg></div></div>
    <div class="field"><span>Contrasena de acceso</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="3" y="7" width="10" height="6" rx="1.5"/><path d="M5.5 7V5.7a2.5 2.5 0 0 1 5 0V7"/><circle cx="8" cy="10" r="1"/></svg></div></div>
    <div class="field"><span>URL API</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><path d="M6 5 3.5 8 6 11M10 5l2.5 3-2.5 3M6.8 12l2.4-8"/></svg></div></div>
    <div class="field"><span>Current user</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><circle cx="8" cy="5.2" r="2.3"/><path d="M3.5 12.8c1-2 2.6-3 4.5-3s3.5 1 4.5 3"/></svg></div></div>
    <div class="field"><span>DNS 1</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="3" y="3" width="10" height="3" rx="1"/><rect x="3" y="7" width="10" height="3" rx="1"/><circle cx="5" cy="4.5" r=".6" fill="#7c5fc5"/><circle cx="5" cy="8.5" r=".6" fill="#7c5fc5"/><path d="M8 10v3"/></svg></div></div>
    <div class="field"><span>DNS 2</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="3" y="3" width="10" height="3" rx="1"/><rect x="3" y="7" width="10" height="3" rx="1"/><rect x="3" y="11" width="10" height="2" rx="1"/><circle cx="5" cy="4.5" r=".6" fill="#7c5fc5"/><circle cx="5" cy="8.5" r=".6" fill="#7c5fc5"/><circle cx="5" cy="12" r=".6" fill="#7c5fc5"/></svg></div></div>
    <div class="field"><span>URL panel</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M2.5 5.5h11M5 3v2.5"/></svg></div></div>
    <div class="field"><span>APIKEY</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><circle cx="5.5" cy="8" r="2"/><path d="M7.5 8H13M11 8v2M9.2 8v1.4"/></svg></div></div>
    <div class="field"><span>MultiPHP Manager enlace</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="3" y="3" width="10" height="10" rx="1.5"/><path d="M6 1.8v2.4M10 1.8v2.4M6 11.8v2.4M10 11.8v2.4M1.8 6h2.4M11.8 6h2.4M1.8 10h2.4M11.8 10h2.4"/></svg></div></div>
    <div class="field"><span>MultiPHP INI Editor</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><path d="M5 2.5h4l2.5 2.5V13H5z"/><path d="M9 2.5V5h2.5M6.3 8.2 5 9.5l1.3 1.3M9.7 8.2 11 9.5l-1.3 1.3"/></svg></div></div>
    <div class="field"><span>Softaculous WordPress enlace</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.3"><circle cx="8" cy="8" r="5.5"/><path d="m4.8 5.2 1.6 5.6 1.7-5 1.5 5 1.6-5.6"/></svg></div></div>
    <div class="field"><span>CPS</span><div class="field-icon"><svg viewBox="0 0 16 16" fill="none" stroke="#7c5fc5" stroke-width="1.4"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M5.5 6h1.5M9 6h1.5M5.5 9h1.5M9 9h1.5"/></svg></div></div>
  </div>
</div>
</body>
</html>
